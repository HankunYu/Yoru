# Yoru input.conf: this file is yours and Yoru never overwrites it.
# Same format as ~/.config/mpv/input.conf; mpv's default key bindings stay active
# (useful with a hardware keyboard).
#
# Touch gestures arrive as GESTURE_* keys. Yoru's defaults are listed below as they are
# out of the box (Settings > Gestures changes some of them); uncomment and change a line
# to override it. A line here always wins over Settings.
#
# Yoru-specific actions are script messages:
#   script-message yoru toggle-controls
#   script-message yoru show-position
#   script-message yoru brightness <delta>    screen brightness, 0..1
#   script-message yoru volume <delta>        system volume, 0..1
#                                             (use "add volume <n>" for mpv's own volume)
#   script-message yoru hold-speed <speed>    play at <speed> until the finger lifts
# A horizontal drag is not a key: it scrubs continuously (see script-opts/yoru.conf).
# Example: GESTURE_DOUBLE_TAP_RIGHT no-osd seek 10; script-message yoru show-position
# A pinch sends its key once per step, so it can also zoom gradually:
#   GESTURE_PINCH_OUT no-osd add video-zoom 0.04
#
#GESTURE_TAP                script-message yoru toggle-controls
#GESTURE_DOUBLE_TAP_LEFT    cycle pause
#GESTURE_DOUBLE_TAP_CENTER  cycle pause
#GESTURE_DOUBLE_TAP_RIGHT   cycle pause
#GESTURE_LEFT_UP            script-message yoru brightness 0.03
#GESTURE_LEFT_DOWN          script-message yoru brightness -0.03
#GESTURE_RIGHT_UP           script-message yoru volume 0.03
#GESTURE_RIGHT_DOWN         script-message yoru volume -0.03
#GESTURE_PINCH_OUT          no-osd set panscan 1
#GESTURE_PINCH_IN           no-osd set panscan 0
#GESTURE_HOLD               script-message yoru hold-speed 2
