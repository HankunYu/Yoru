# Options for Yoru's own interface, in mpv's script-opts format (key=value).

# While dragging the seek bar, jump between keyframes (fast) and seek exactly only on
# release. Set to no to seek exactly while dragging (precise, slower on sparse keyframes).
seekbar-keyframes=yes

# Seconds seeked per point of horizontal swipe on the video. Lower is finer.
swipe-seek-rate=0.15
