# Options for Yoru's own interface, in mpv's script-opts format (key=value).

# While dragging the seek bar, jump between keyframes (fast) and seek exactly only on
# release. Set to no to seek exactly while dragging (precise, slower on sparse keyframes).
seekbar-keyframes=yes

# Seconds seeked per point of horizontal swipe on the video. Lower is finer.
swipe-seek-rate=0.15

# The options below shape Yoru's built-in touch bindings. A binding for the same gesture
# in input.conf takes precedence over them.

# Seconds a double tap on the left or right third of the video seeks back or forward.
# 0 makes the sides play/pause, like the center.
double-tap-seek=0

# Vertical drag on one half of the video changes the screen brightness, on the other the
# system volume. swap-gesture-sides=yes puts brightness on the right and volume on the left.
brightness-gesture=yes
volume-gesture=yes
swap-gesture-sides=no

# Playback speed while a finger is held down on the video.
hold-speed=2

# What happens when a video ends: next (play the next file of the folder, or stay on the
# last frame if there is none), stay (stay on the last frame) or close (close the player).
at-end=next
