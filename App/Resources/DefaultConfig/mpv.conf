# Yoru mpv.conf: this file is yours and Yoru never overwrites it.
# Same format as ~/.config/mpv/mpv.conf; see https://mpv.io/manual/stable/#options
#
# Yoru sets these before reading this file, so any of them can be overridden here:
#   vo=gpu-next gpu-api=vulkan gpu-context=moltenvk hwdec=videotoolbox
#   keep-open=yes save-position-on-quit=yes input-default-bindings=yes
#   sub-font="Noto Sans CJK SC" (bundled in fonts/; iOS apps cannot read system fonts,
#   so drop any other fonts your subtitles need into fonts/ as well)
#   target-colorspace-hint=yes (only when the display supports EDR)
# Rendering options (vo, gpu-*, target-colorspace-hint) only take effect on the next
# player launch.

# Prefer Chinese subtitles, then English.
slang=chi,zh,zho,chs,sc,cht,tc,eng,en
alang=jpn,ja,chi,zh,eng,en
sub-auto=fuzzy
