# Yoru's built-in touch bindings. They are loaded as a default input section, so any
# binding for the same key in your input.conf takes precedence.
#
# Keys:
#   GESTURE_TAP                               single tap
#   GESTURE_DOUBLE_TAP_LEFT / _CENTER / _RIGHT  double tap, by horizontal third
#   GESTURE_LEFT_UP / _DOWN                   vertical drag on the left half, per step
#   GESTURE_RIGHT_UP / _DOWN                  vertical drag on the right half, per step
#   GESTURE_PINCH_IN / _OUT                   pinch, per step
#
# A horizontal drag is not a key: it scrubs continuously, like the seek bar
# (see swipe-seek-rate and seekbar-keyframes in script-opts/yoru.conf).
#
# Yoru-specific actions are script messages:
#   script-message yoru toggle-controls
#   script-message yoru show-position
#   script-message yoru brightness <delta>

GESTURE_TAP                script-message yoru toggle-controls
GESTURE_DOUBLE_TAP_LEFT    no-osd seek -10; script-message yoru show-position
GESTURE_DOUBLE_TAP_CENTER  cycle pause
GESTURE_DOUBLE_TAP_RIGHT   no-osd seek 10; script-message yoru show-position
GESTURE_LEFT_UP            script-message yoru brightness 0.03
GESTURE_LEFT_DOWN          script-message yoru brightness -0.03
GESTURE_RIGHT_UP           no-osd add volume 2
GESTURE_RIGHT_DOWN         no-osd add volume -2
GESTURE_PINCH_OUT          no-osd add video-zoom 0.04
GESTURE_PINCH_IN           no-osd add video-zoom -0.04
